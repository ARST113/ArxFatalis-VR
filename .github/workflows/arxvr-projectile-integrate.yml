name: ArxVR projectile defense integration

on:
  push:
    branches:
      - vr-foundation-phase1
    paths:
      - '.github/workflows/arxvr-projectile-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: vr-foundation-phase1
          fetch-depth: 5

      - name: Apply guarded projectile integration
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile tools/arxvr_apply_projectile_deflection_live.py
          BEFORE_CRLF="$(python3 - <<'PY'
          from pathlib import Path
          data = Path('ArxAndroid/src/physics/Projectile.cpp').read_bytes()
          print(data.count(b'\r\n'))
          PY
          )"
          python3 tools/arxvr_apply_projectile_deflection_live.py
          AFTER_CRLF="$(python3 - <<'PY'
          from pathlib import Path
          data = Path('ArxAndroid/src/physics/Projectile.cpp').read_bytes()
          print(data.count(b'\r\n'))
          PY
          )"
          test "${BEFORE_CRLF}" -gt 0
          test "${AFTER_CRLF}" -gt "${BEFORE_CRLF}"
          git -c core.whitespace=cr-at-eol diff --check -- ArxAndroid/src/physics/Projectile.cpp
          grep -Fq 'vrEvaluateProjectileDefense(arxvr::vrDefenseRuntime()' ArxAndroid/src/physics/Projectile.cpp
          grep -Fq 'arxvrTryDeflectProjectile(projectile, original_pos);' ArxAndroid/src/physics/Projectile.cpp
          test "$(grep -Fc 'arxvrTryDeflectProjectile(projectile, original_pos);' ArxAndroid/src/physics/Projectile.cpp)" -eq 1

      - name: Audit semantic diff
        shell: bash
        run: |
          set -euxo pipefail
          git diff --numstat -- ArxAndroid/src/physics/Projectile.cpp
          CHANGED="$(git diff --numstat -- ArxAndroid/src/physics/Projectile.cpp | awk '{print $1+$2}')"
          test -n "${CHANGED}"
          test "${CHANGED}" -ge 70
          test "${CHANGED}" -le 180
          git diff -- ArxAndroid/src/physics/Projectile.cpp

      - name: Commit generated live integration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          # The helper is intentionally one-shot. Keep the guarded Python
          # integrator for reproducibility, but do not leave another permanent
          # CI workflow beside the canonical clean Android workflow.
          rm .github/workflows/arxvr-projectile-integrate.yml
          git add ArxAndroid/src/physics/Projectile.cpp .github/workflows/arxvr-projectile-integrate.yml
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire live projectile deflection into Arx physics'
          git push origin HEAD:vr-foundation-phase1
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "Integrated commit: ${FINAL_SHA}"
          # workflow_dispatch is allowed to create a fresh run even though this
          # integration commit itself was pushed with GITHUB_TOKEN.
          gh workflow run arxvr-android.yml --ref vr-foundation-phase1
