name: ArxVR Phase 7 spell aim integration helper

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ArxAndroid/src/vr/VrSpellAim.h'
      - 'ArxAndroid/src/vr/tests/VrSpellAimTest.cpp'
      - 'tools/arxvr_apply_phase7_spell_aim.py'
      - '.github/workflows/arxvr-phase7-spell-aim-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'vr-foundation-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-foundation-phase1
          fetch-depth: 0

      - name: Validate spell aim generator
        run: python3 -m py_compile tools/arxvr_apply_phase7_spell_aim.py

      - name: Apply guarded spell aim integration
        run: python3 tools/arxvr_apply_phase7_spell_aim.py

      - name: Validate generated spell aim routing
        shell: bash
        run: |
          set -euxo pipefail
          GAME=ArxAndroid/src/core/ArxGame.cpp
          SPELL=ArxAndroid/src/game/magic/spells/SpellsLvl01.cpp
          grep -F '#include "vr/VrSpellAim.h"' "$GAME"
          grep -F 'arxvr::vrSpellAimService().clear();' "$GAME"
          grep -F 'arxvr::vrSpellAimService().update(vrSpellAimSample);' "$GAME"
          grep -F '#include "vr/VrSpellAim.h"' "$SPELL"
          grep -F 'arxvr::vrSpellAimService().ray()' "$SPELL"
          grep -F 'unitVectorToAngle(vrHandDirection)' "$SPELL"
          grep -F 'vrPhysicalLaunchOffset' "$SPELL"
          grep -F 'm_caster == EntityHandle_Player' "$SPELL"
          grep -F 'startPos += angleToVector(Anglef(pitch, yaw, 0.f)) * 60.f;' "$SPELL"

      - name: Audit generated diff
        shell: bash
        run: |
          set -euxo pipefail
          GAME=ArxAndroid/src/core/ArxGame.cpp
          SPELL=ArxAndroid/src/game/magic/spells/SpellsLvl01.cpp
          git -c core.whitespace=cr-at-eol diff --check -- "$GAME" "$SPELL"
          git diff --stat -- "$GAME" "$SPELL"
          read GADD GDEL _ < <(git diff --numstat -- "$GAME")
          read SADD SDEL _ < <(git diff --numstat -- "$SPELL")
          test "$GADD" != "-" && test "$GDEL" != "-"
          test "$SADD" != "-" && test "$SDEL" != "-"
          test $((GADD + GDEL)) -le 80
          test $((SADD + SDEL)) -le 100

      - name: Commit generated spell aim integration
        shell: bash
        run: |
          set -euxo pipefail
          GAME=ArxAndroid/src/core/ArxGame.cpp
          SPELL=ArxAndroid/src/game/magic/spells/SpellsLvl01.cpp
          if git diff --quiet -- "$GAME" "$SPELL"; then
            echo 'Spell aim integration already current.'
            exit 0
          fi
          git add "$GAME" "$SPELL"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Wire physical casting-hand aim into Magic Missile'
          git push origin HEAD:vr-foundation-phase1
