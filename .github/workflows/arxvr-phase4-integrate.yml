name: ArxVR Phase 4 integration helper

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/arxvr_apply_phase4_live_integration_v2.py'
      - '.github/workflows/arxvr-phase4-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'vr-foundation-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-foundation-phase1
          fetch-depth: 0
      - name: Validate integration generator
        run: python3 -m py_compile tools/arxvr_apply_phase4_live_integration_v2.py
      - name: Restore pre-integration ArxGame and apply guarded patch
        shell: bash
        run: |
          set -euxo pipefail
          BASE_COMMIT=0e52d4cde5b228fcfc23f7730bb22b9919bd173d
          SOURCE=ArxAndroid/src/core/ArxGame.cpp
          git show "${BASE_COMMIT}:${SOURCE}" > "${SOURCE}"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("ArxAndroid/src/core/ArxGame.cpp")
          path.write_bytes(path.read_bytes().replace(b"\r\n", b"\n"))
          PY
          python3 tools/arxvr_apply_phase4_live_integration_v2.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("ArxAndroid/src/core/ArxGame.cpp")
          base = subprocess.check_output([
              "git", "show",
              "0e52d4cde5b228fcfc23f7730bb22b9919bd173d:ArxAndroid/src/core/ArxGame.cpp"
          ])
          data = path.read_bytes().replace(b"\r\n", b"\n")
          if b"\r\n" in base:
              data = data.replace(b"\n", b"\r\n")
          path.write_bytes(data)
          PY
      - name: Validate generated C++ source
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE=ArxAndroid/src/core/ArxGame.cpp
          grep -F '#include "vr/VrHandState.h"' "$SOURCE"
          grep -F 'VrImpactGateStatus::Qualified' "$SOURCE"
          grep -F 'consumeQualifiedImpact' "$SOURCE"
          if grep -Fq 'static arxvr::VrHandState g_vrRightHandImpact;\n"' "$SOURCE"; then
            echo "Serialized Python literal found in generated C++" >&2
            exit 1
          fi
          if grep -Fq '"\n    "' "$SOURCE"; then
            echo "Quoted generator fragment found in generated C++" >&2
            exit 1
          fi
      - name: Require integration diff
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE=ArxAndroid/src/core/ArxGame.cpp
          ! git diff --quiet -- "$SOURCE"
          git diff --stat -- "$SOURCE"
      - name: Stage generated ArxGame
        shell: bash
        run: |
          set -euxo pipefail
          git add ArxAndroid/src/core/ArxGame.cpp
      - name: Repair generated trailing whitespace and audit diff
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE=ArxAndroid/src/core/ArxGame.cpp
          git diff --cached --check > /tmp/arxvr-diff-check.txt 2>&1 || true
          cat /tmp/arxvr-diff-check.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("ArxAndroid/src/core/ArxGame.cpp")
          report = Path("/tmp/arxvr-diff-check.txt").read_text(errors="replace").splitlines()
          trailing_lines = set()
          unsupported = []
          for line in report:
              match = re.match(r"ArxAndroid/src/core/ArxGame\.cpp:(\d+): trailing whitespace\.$", line)
              if match:
                  trailing_lines.add(int(match.group(1)))
              elif line.strip():
                  unsupported.append(line)
          if unsupported:
              raise SystemExit("Unsupported diff-check diagnostics:\n" + "\n".join(unsupported))
          if trailing_lines:
              lines = source.read_bytes().splitlines(keepends=True)
              for lineno in trailing_lines:
                  index = lineno - 1
                  if index < 0 or index >= len(lines):
                      raise SystemExit(f"Invalid diff-check line number: {lineno}")
                  lines[index] = re.sub(rb"[ \t]+(\r?\n)$", rb"\1", lines[index])
              source.write_bytes(b"".join(lines))
          PY
          git add "$SOURCE"
          git -c core.whitespace=cr-at-eol diff --cached --check
      - name: Audit staged scope
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE=ArxAndroid/src/core/ArxGame.cpp
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -Fx "$SOURCE"
      - name: Commit repaired live integration
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repair Phase 4 live combat integration"
      - name: Push repaired live integration
        shell: bash
        run: |
          set -euxo pipefail
          git push origin HEAD:vr-foundation-phase1
