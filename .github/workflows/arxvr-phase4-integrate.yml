name: ArxVR Phase 4 integration helper

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/arxvr_apply_phase4_live_integration.py'
      - '.github/workflows/arxvr-phase4-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'vr-foundation-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-foundation-phase1
          fetch-depth: 0
      - name: Restore pre-integration ArxGame and apply guarded patch
        shell: bash
        run: |
          set -euxo pipefail
          BASE_COMMIT=0e52d4cde5b228fcfc23f7730bb22b9919bd173d
          git checkout "${BASE_COMMIT}" -- ArxAndroid/src/core/ArxGame.cpp
          python3 tools/arxvr_apply_phase4_live_integration.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("ArxAndroid/src/core/ArxGame.cpp")
          base = subprocess.check_output([
              "git", "show",
              "0e52d4cde5b228fcfc23f7730bb22b9919bd173d:ArxAndroid/src/core/ArxGame.cpp"
          ])
          data = path.read_bytes().replace(b"\r\n", b"\n")
          if b"\r\n" in base:
              data = data.replace(b"\n", b"\r\n")
          path.write_bytes(data)
          PY
      - name: Commit live integration
        shell: bash
        run: |
          set -euxo pipefail
          if git diff --quiet -- ArxAndroid/src/core/ArxGame.cpp; then
            echo "No integration diff produced" >&2
            exit 1
          fi
          git diff --check
          git diff --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ArxAndroid/src/core/ArxGame.cpp
          git commit -m "Fix live combat integration without newline churn"
          git push origin HEAD:vr-foundation-phase1
