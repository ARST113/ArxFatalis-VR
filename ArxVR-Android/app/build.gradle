plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arxvr.android'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.arxvr.android'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0-dev'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-29',
                          '-DANDROID_STL=c++_shared',
                          '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                cppFlags '-std=c++20'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs += "${rootDir}/../SDL2/android-project/app/src/main/java"
            assets.srcDirs += "${rootDir}/../android-deps/app/src/main/assets"
            assets.srcDirs += "${rootDir}/../PICO-OpenXR-Demos/app/src/main/assets"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
